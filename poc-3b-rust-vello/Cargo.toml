[package]
name    = "poc-3b-rust-vello"
version = "0.1.0"
edition = "2021"
description = "PoC 3B — Rust + Vello (GPU Compute Shader vector renderer)"

[[bin]]
name = "poc3b"
path = "src/main.rs"

[dependencies]
# Vello: GPU-first vector renderer (Compute Shaders, no texture atlas)
vello = { git = "https://github.com/linebender/vello", branch = "main" }

# Shared workspace deps
memmap2    = { workspace = true }
memchr     = { workspace = true }
wgpu       = { workspace = true }
winit      = { workspace = true }
tokio      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }

# Font parsing (Vello uses kurbo for geometry; ttf-parser for font data)
ttf-parser = { workspace = true }
skrifa     = "0.19"   # Google's OpenType font reading library used by Vello internally

