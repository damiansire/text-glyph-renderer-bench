[package]
name    = "poc-3b-rust-vello"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PoC 3B — Rust + Vello (GPU Compute Shader vector renderer)"

[[bin]]
name = "poc3b"
path = "src/main.rs"

[lib]
name = "poc_3b_rust_vello"
path = "src/lib.rs"

[dependencies]
# Shared text buffer (piece table + line index), consumed by 3A and 3B alike.
text-buffer = { path = "../text-buffer" }

# Vello: GPU-first vector renderer (Compute Shaders, no texture atlas)
# TODO(repro): pinear a un rev/tag concreto en vez de branch="main" para builds reproducibles
vello = { git = "https://github.com/linebender/vello", branch = "main" }

# Shared workspace deps
memmap2    = { workspace = true }
memchr     = { workspace = true }
wgpu       = { workspace = true }
winit      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }

# Font parsing (Vello uses kurbo for geometry; ttf-parser for font data)
ttf-parser = { workspace = true }
skrifa     = "0.19"   # Google's OpenType font reading library used by Vello internally

[dev-dependencies]
criterion = { workspace = true }
font-test-data = "0.4.1"

[[bench]]
name = "buffer_bench"
harness = false

[lints]
workspace = true

