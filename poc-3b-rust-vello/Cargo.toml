[package]
name    = "poc-3b-rust-vello"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PoC 3B — Rust + Vello (GPU Compute Shader vector renderer)"

[[bin]]
name = "poc3b"
path = "src/main.rs"

[lib]
name = "poc_3b_rust_vello"
path = "src/lib.rs"

[dependencies]
# Shared text buffer (piece table + line index), consumed by 3A and 3B alike.
text-buffer = { path = "../text-buffer" }

# Vello: GPU-first vector renderer (Compute Shaders, no texture atlas).
# Pineado al rev exacto que ya fija el Cargo.lock: una `branch = "main"` de un
# repo de terceros hace que cualquier resolucion fuera del lock traiga codigo
# distinto y los numeros dejen de ser reproducibles.
vello = { git = "https://github.com/linebender/vello", rev = "ea2a935ec79206fb5dd3d367ac8feb79bffc905b" }

# Shared workspace deps. 3B accede al texto por el crate `text-buffer` (que
# encapsula mmap y memchr) y parsea la fuente con skrifa, asi que NO declara
# memmap2/memchr/ttf-parser. Tampoco wgpu ni winit: arrastraban una segunda pila
# GPU entera (wgpu 22 + naga 22) que este binario nunca toca, encima de la
# wgpu 28 que Vello si necesita.
serde_json = { workspace = true }

# Font parsing: skrifa es la libreria OpenType que Vello usa internamente.
skrifa     = "0.19"

[dev-dependencies]
font-test-data = "0.4.1"

[lints]
workspace = true

