[package]
name    = "poc-3a-rust-wgpu"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PoC 3A — Rust + wgpu (Metal backend) + HarfBuzz/rustybuzz text shaping"

[[bin]]
name = "poc3a"
path = "src/main.rs"

# El render GPU real llego (tgrb-4): rasterizador CPU (ttf-parser) + atlas de
# texturas + shaping HarfBuzz (rustybuzz) + pipeline wgpu (headless, sin
# winit: se renderiza a una textura offscreen, no hace falta ventana para el
# benchmark). El runtime async (tokio) sigue sin reintroducirse: `pollster`
# alcanza para bloquear sobre los dos `Future` de wgpu (request_adapter /
# request_device), no hace falta un executor completo.
[dependencies]
text-buffer = { path = "../text-buffer" }
serde_json  = { workspace = true }
wgpu        = { workspace = true }
rustybuzz   = { workspace = true }
ttf-parser  = { workspace = true }
lru         = { workspace = true }
# No esta en [workspace.dependencies]: es chiquita, sin deps propias, solo
# bloquea sobre los dos `Future` que expone wgpu (request_adapter /
# request_device) tanto en el CLI (--bench) como en los tests con GPU real.
pollster    = "0.3"

[dev-dependencies]
criterion       = { workspace = true }
font-test-data  = "0.4.1"

[[bench]]
name = "buffer_bench"
harness = false

[[bench]]
name = "range_alloc_bench"
harness = false

[lints]
workspace = true
