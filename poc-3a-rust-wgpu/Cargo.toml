[package]
name    = "poc-3a-rust-wgpu"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "PoC 3A — Rust + wgpu (Metal backend) + HarfBuzz/rustybuzz text shaping"

[[bin]]
name = "poc3a"
path = "src/main.rs"

# Solo lo que el crate usa de verdad: la lib re-exporta `text-buffer` y `main`
# serializa stats con `serde_json`. Las deps de GPU/shaping/runtime (wgpu, winit,
# tokio, rustybuzz, ttf-parser, lru) se reincorporan cuando exista el renderer.
[dependencies]
text-buffer = { path = "../text-buffer" }
serde_json  = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "buffer_bench"
harness = false

[lints]
workspace = true
