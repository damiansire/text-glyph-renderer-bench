[package]
name    = "poc-3a-rust-wgpu"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "PoC 3A — Rust + wgpu (Metal backend) + HarfBuzz/rustybuzz text shaping"

[[bin]]
name = "poc3a"
path = "src/main.rs"

[dependencies]
memmap2    = { workspace = true }
memchr     = { workspace = true }
tokio      = { workspace = true }
wgpu       = { workspace = true }
rustybuzz  = { workspace = true }
ttf-parser = { workspace = true }
lru        = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
winit      = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "buffer_bench"
harness = false

[lints]
workspace = true
