[package]
name    = "text-buffer"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Piece table zero-copy sobre mmap + indice de lineas SIMD, compartido por las PoCs Rust (3A/3B)."

[lib]
name = "text_buffer"
path = "src/lib.rs"

[dependencies]
memmap2 = { workspace = true }
memchr  = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

# The benches of this crate live in this crate. They used to be copy-pasted into
# both consumers (3A and 3B), which is the duplication this crate exists to
# remove, and the two copies had already started to drift apart.
[[bench]]
name = "buffer_bench"
harness = false

[[bench]]
name = "range_alloc_bench"
harness = false

[lints]
workspace = true
