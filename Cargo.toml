[workspace]
members = [
    "text-buffer",
    "poc-3a-rust-wgpu",
    "poc-3b-rust-vello",
]
resolver = "2"

[workspace.package]
# MSRV: fuente unica de verdad. Mantener en sync con el README y los workflows.
# 1.92: MSRV real declarado por vello 0.7 / vello_shaders / vello_encoding y
# wgpu 28 (deps del poc-3b via vello?branch=main). 1.85 no alcanzaba: solo
# estabiliza edition2024, pero vello 0.7 exige rustc 1.92 por su `rust-version`,
# asi que el resolver de cargo rechazaba el workspace con "rustc 1.85 is not
# supported". Rev de vello pineado en Cargo.lock (ea2a935) para reproducibilidad.
rust-version = "1.92"
license = "MIT"
authors = ["Damian Sire <damiansire@gmail.com>"]
repository = "https://github.com/damiansire/text-glyph-renderer-bench"

# Set de lints del workspace. Heredado por cada crate con `[lints] workspace = true`.
# Todo en "warn" a proposito: el repo usa `unsafe` (memmap) y `unwrap` en hot paths
# de PoC, asi que estos lints documentan deuda sin romper el build. Subir a "deny"
# cuando se limpie cada categoria.
[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# El de mayor ROI en un render path: castear f32 de subpixel a i32 de pixel
# esconde off-by-one silenciosos.
cast_possible_truncation = "warn"
semicolon_if_nothing_returned = "warn"
use_self = "warn"
dbg_macro = "warn"
todo = "warn"
wildcard_dependencies = "warn"
allow_attributes_without_reason = "warn"

[workspace.dependencies]
# Data / IO
memmap2    = "0.9"
memchr     = "2.7"

# GPU backends
wgpu       = { version = "22", features = ["metal"] }

# Font / shaping
rustybuzz    = "0.14"          # pure-Rust HarfBuzz port (no C dep)
ttf-parser   = "0.21"

# Collections / cache
lru        = "0.12"

# Serialization
serde_json = "1"

# Benchmarking
criterion  = { version = "0.5", features = ["html_reports"] }

# Sin harfbuzz-sys / serde / winit: ningun crate del workspace los consumia.
# 3A shapea con rustybuzz, ambos PoCs serializan con serde_json (que trae su
# propio serde), y no hay camino con ventana (3A renderiza a textura offscreen
# y 3B es un microbench de CPU headless).
