[workspace]
members = [
    "text-buffer",
    "poc-3a-rust-wgpu",
    "poc-3b-rust-vello",
]
resolver = "2"

[workspace.package]
# MSRV: fuente unica de verdad. Mantener en sync con el README.
rust-version = "1.78"

# Set de lints del workspace. Heredado por cada crate con `[lints] workspace = true`.
# Todo en "warn" a proposito: el repo usa `unsafe` (memmap) y `unwrap` en hot paths
# de PoC, asi que estos lints documentan deuda sin romper el build. Subir a "deny"
# cuando se limpie cada categoria.
[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# El de mayor ROI en un render path: castear f32 de subpixel a i32 de pixel
# esconde off-by-one silenciosos.
cast_possible_truncation = "warn"
semicolon_if_nothing_returned = "warn"
use_self = "warn"
dbg_macro = "warn"
todo = "warn"
wildcard_dependencies = "warn"
allow_attributes_without_reason = "warn"

[workspace.dependencies]
# Data / IO
memmap2    = "0.9"
memchr     = "2.7"

# Async runtime
tokio      = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

# GPU backends
wgpu       = { version = "22", features = ["metal"] }

# Font / shaping
harfbuzz-sys = "0.5"
rustybuzz    = "0.14"          # pure-Rust HarfBuzz port (no C dep) — swap for harfbuzz-sys if needed
ttf-parser   = "0.21"

# Collections / cache
lru        = "0.12"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Benchmarking
criterion  = { version = "0.5", features = ["html_reports"] }

# Windowing (for PoC 3A/3B standalone window)
winit      = "0.29"
