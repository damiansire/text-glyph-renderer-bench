name: Bench

# Cross-platform benchmark matrix, separate from `ci.yml` (which is the
# correctness gate). This workflow is informational: it runs the
# cross-platform Rust PoCs (3A/3B, the only stacks that build on all three
# OSes — 2A/2B are macOS-only Swift, 1A-1D are Electron/WebGPU and depend on
# a GPU adapter being available in the runner, which is not guaranteed) and
# uploads each platform's `*_stats.json` as an artifact. It never fails the
# build on a slow/degraded number — only on the PoCs not compiling/running.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "poc-3a-rust-wgpu/**"
      - "poc-3b-rust-vello/**"
      - "text-buffer/**"
      - "shared/test-data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bench.yml"

# Privilegio minimo: este workflow compila, corre los benches y sube artifacts;
# no necesita escribir en el repo (upload-artifact usa la API de artifacts del
# runner, no el token de contents).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.92 (pinned MSRV)
        # Pineada a SHA: `@master` es una rama mutable de un repo de terceros,
        # asi que cualquier commit nuevo alla corre con permisos plenos dentro
        # del runner en cada push y cada PR. Este SHA es el que la rama
        # resolvia al pinear (equivalente exacto a lo que ya corria).
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.92"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: pip install jsonschema

      # Full 100 MB corpus is unnecessary (and slow) for a CI smoke bench —
      # a 5 MB slice exercises the same code paths (shaping, atlas, line
      # index) at a fraction of the wall-clock cost.
      - name: Generate small test corpus
        run: python3 shared/test-data/generate_testfile.py --size 5

      # La fuente es insumo del hot path de shaping, asi que su integridad ancla
      # la reproducibilidad de los numeros: ref inmutable (commit, no branch),
      # curl --fail (un 404 ya no deja un HTML disfrazado de .ttf) y SHA-256
      # verificado antes de usarla. El mismo bloque vive en el README.
      - name: Get a test font (pinned + checksum)
        shell: bash
        run: |
          mkdir -p shared/fonts
          curl --fail --location --silent --show-error -o shared/fonts/InterVariable.ttf \
            https://raw.githubusercontent.com/rsms/inter/353b61b9f4430d5f420d56605a6e7993e0941470/docs/font-files/InterVariable.ttf
          python3 - <<'PY'
          import hashlib, sys
          expected = "4989b125924991b90d05b2d16e0e388c48f7d5bb8b30539bbf9c755278d0ccaf"
          actual = hashlib.sha256(open("shared/fonts/InterVariable.ttf", "rb").read()).hexdigest()
          if actual != expected:
              sys.exit(f"font SHA-256 mismatch:\n  expected {expected}\n  got      {actual}")
          print("font SHA-256 OK")
          PY

      - name: Build Rust PoCs (release)
        run: cargo build --release --locked -p poc-3a-rust-wgpu -p poc-3b-rust-vello

      # `--frames` kept small: this workflow verifies the cross-platform path
      # runs end-to-end and captures a real number for the README table, it
      # is not the statistically-rigorous run described in the README's
      # "Statistical Methodology" section (warm-up passes, thermal cooldown).
      # GPU adapters are not guaranteed on hosted runners (see poc-3a's own
      # `gpu_available` field in its report) — a `false` value here is an
      # honest result, not a failure.
      - name: Run PoC 3A bench (wgpu + HarfBuzz)
        shell: bash
        run: |
          cargo run --release --locked -p poc-3a-rust-wgpu -- \
            --file shared/test-data/test_5mb.txt --font shared/fonts/InterVariable.ttf \
            --bench --frames 200

      - name: Run PoC 3B bench (Vello, headless scene build)
        shell: bash
        run: |
          cargo run --release --locked -p poc-3b-rust-vello -- \
            --file shared/test-data/test_5mb.txt --font shared/fonts/InterVariable.ttf \
            --bench --headless --frames 200

      # Smoke gate (tgrb): a bench "ran" only if it emitted a report that
      # conforms to frame_stats.schema.json with the right poc_id. Same check
      # the local smoke suite uses (shared/metrics/validate_report.py), so a
      # PoC that silently stops emitting stats reds the build here.
      - name: Validate emitted stats against schema
        shell: bash
        run: |
          python3 shared/metrics/validate_report.py results/3a-rust-wgpu_stats.json 3a-rust-wgpu
          python3 shared/metrics/validate_report.py results/3b-rust-vello_stats.json 3b-rust-vello

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-results-${{ matrix.os }}
          path: results/*.json
          if-no-files-found: warn
