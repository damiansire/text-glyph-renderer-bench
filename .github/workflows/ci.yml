name: CI

# Coverage note (tgrb-1): this workflow runs entirely on `ubuntu-latest` and
# therefore CANNOT build or run `poc-2a-textkit2` / `poc-2b-metal3-coretext`
# (native macOS: TextKit 2 and Metal 3 are Apple-only APIs, the Swift
# toolchain for them does not target Linux). Those two PoCs are the only ones
# NOT covered by any job below. Everything else (the two Rust PoCs, the four
# Web/Electron PoCs, the Python orchestrator) IS covered. Running 2A/2B in CI
# would require a `macos-latest` runner; that is tracked separately in
# `bench.yml`'s cross-platform matrix, which builds/benches the Rust PoCs
# (the only stacks that are actually cross-platform) on macOS too, but still
# does not exercise 2A/2B since they are out of scope for that workflow.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── Rust (text-buffer + the two Rust PoCs) ──────────────────────────────────
  rust:
    name: fmt + clippy + test + check (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.78 (pinned MSRV)
        # Audit P8: pin the toolchain so the gate is reproducible and matches
        # the workspace `rust-version`. dtolnay/rust-toolchain takes the version
        # as the `toolchain` input.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.78"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets

      # Audit P8 / tgrb-1: run every Rust crate's tests, including poc-3b.
      # poc-3b's binary used to be excluded here because it crashed
      # (0xC0000005) — that crash predated the fix that made `build_scene`
      # encode real glyph geometry via `Scene::draw_glyphs` (see git history);
      # re-verified after that fix landed: `cargo test -p poc-3b-rust-vello`
      # and a real `--bench --headless` run both complete cleanly now, so the
      # exclusion no longer applies and was silently hiding a working crate.
      # GPU-dependent tests (poc-3a's real atlas render) skip themselves with
      # a clear message when no GPU adapter is available, which is expected
      # on this `ubuntu-latest` runner (see poc-3a's own README/doc-comments).
      - name: Test (workspace)
        run: cargo test --workspace

      # `cargo check` re-validates the full workspace compiles; cheap and
      # redundant with `cargo test` for crates with tests, but also catches
      # non-test binaries/examples that `cargo test` would not build.
      - name: Check (workspace)
        run: cargo check --workspace

  # ── Web PoCs (Node / Electron) ──────────────────────────────────────────────
  web:
    name: npm ci + audit (${{ matrix.poc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Audit P8/P10: cover every Web PoC, not just the Rust stack. Each gets
        # a clean install from its lockfile and a production audit so a CVE
        # (e.g. the old electron@30 with 12 high) fails CI.
        poc: [poc-1a-web-dom, poc-1b-canvas2d, poc-1c-webgpu-atlas, poc-1d-webgpu-msdf]
    defaults:
      run:
        working-directory: ${{ matrix.poc }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm ci` requires a lockfile; fall back to `npm install` for PoCs that
      # ship only a package.json.
      - name: Install
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Audit (production deps)
        # Audit P10: block shipping Electron CVEs. `--audit-level=high` fails
        # only on high/critical so a low-severity advisory does not red the gate.
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax check JS entry points
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f"; done

  # ── Python orchestrator + JSON Schema contract ──────────────────────────────
  python:
    name: ruff + py_compile + schema gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node is needed for the 1A headless smoke test (Node baseline path).
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tooling
        run: pip install ruff jsonschema

      - name: Lint (ruff)
        run: ruff check shared/

      - name: Compile check
        run: python -m py_compile shared/metrics/benchmark_runner.py shared/metrics/validate_report.py shared/metrics/test_smoke.py shared/test-data/generate_testfile.py

      # tgrb: one smoke test per PoC that emits stats. 1A runs for real here
      # (Node); 3A/3B are gated by bench.yml; 1B/1C (Electron GUI) and 2A/2B
      # (macOS) have no headless path and skip with an explicit reason.
      - name: Smoke tests (per-PoC stats contract)
        run: python -m unittest shared.metrics.test_smoke -v

      # Audit P2: the data contract must be an executable gate. Generate a small
      # corpus, run the runnable PoCs through the orchestrator (which validates
      # each *_stats.json against frame_stats.schema.json) and fail if any
      # report does not conform.
      - name: Schema self-check
        run: |
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open("shared/metrics/frame_stats.schema.json"))
          jsonschema.Draft7Validator.check_schema(schema)
          print("frame_stats.schema.json is a valid draft-07 schema")
          PY
