# Supply-chain: los bumps llegan como PR revisable en vez de descubrirse auditando.
# Saqueo: consenso node-ts (n8n pinea acciones a SHA completo repo-wide) + el kit de
# rerun-io/rerun_template. El objetivo principal de `github-actions` es que el pin a
# SHA de las acciones de terceros se pueda mantener sin volver a un tag mutable.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly

  # Un entry por PoC Web: cada uno tiene su propio package.json + lockfile.
  - package-ecosystem: npm
    directory: "/poc-1a-web-dom"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/poc-1b-canvas2d"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/poc-1c-webgpu-atlas"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/poc-1d-webgpu-msdf"
    schedule:
      interval: weekly
